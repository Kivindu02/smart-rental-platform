name: smart-rental-platform

# Shared network — all containers communicate by service name
networks:
  smart-rental-net:
    driver: bridge

# Named volumes — persistent data for databases

volumes:
  auth-db-data:
  property-db-data:
  review-db-data:
  qdrant-data:

# Services

services:

  # Apache Kafka (KRaft mode — no Zookeeper required)
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    networks:
      - smart-rental-net
    ports:
      - "9094:9094"   # external access from host (optional dev use)
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

#  # Qdrant — Vector DB for the AI service
#  qdrant:
#    image: qdrant/qdrant:v1.10.0
#    container_name: qdrant
#    networks:
#      - smart-rental-net
#    ports:
#      - "6333:6333"   # REST UI accessible at http://localhost:6333/dashboard
#    volumes:
#      - qdrant-data:/qdrant/storage
#    healthcheck:
#      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
#      interval: 10s
#      timeout: 5s
#      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    networks:
      - smart-rental-net
    ports:
      - "8025:8025"   # web inbox

  # DATABASES

  auth-service-db:
    image: postgres:16-alpine
    container_name: auth-service-db
    networks:
      - smart-rental-net
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d db"]
      interval: 10s
      timeout: 5s
      retries: 5

  property-service-db:
    image: postgres:16-alpine
    container_name: property-service-db
    networks:
      - smart-rental-net
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${PROPERTY_DB_USER}
      POSTGRES_PASSWORD: ${PROPERTY_DB_PASSWORD}
    volumes:
      - property-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROPERTY_DB_USER} -d db"]
      interval: 10s
      timeout: 5s
      retries: 5

  review-service-db:
    image: postgres:16-alpine
    container_name: review-service-db
    networks:
      - smart-rental-net
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${REVIEW_DB_USER}
      POSTGRES_PASSWORD: ${REVIEW_DB_PASSWORD}
    volumes:
      - review-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REVIEW_DB_USER} -d db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BACKEND MICROSERVICES

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    networks:
      - smart-rental-net
    depends_on:
      auth-service-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Email (SMTP)
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Base URL used in verification email links — must be reachable by the user's browser
      APP_URL: ${APP_URL:-http://localhost:8080}

  property-service:
    build:
      context: ./property-service
      dockerfile: Dockerfile
    container_name: property-service
    networks:
      - smart-rental-net
    depends_on:
      property-service-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://property-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: ${PROPERTY_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROPERTY_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Cloudinary (image uploads)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: review-service
    networks:
      - smart-rental-net
    depends_on:
      review-service-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      property-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://review-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: ${REVIEW_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${REVIEW_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      # JWT
      JWT_SECRET: ${JWT_SECRET}

