#    environment:
#      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
#      KAFKA_GROUP_ID: ai-service-group
#      QDRANT_HOST: qdrant
#      QDRANT_PORT: 6333
#      QDRANT_COLLECTION_NAME: rental-platform
#      GROQ_API_KEY: ${GROQ_API_KEY}
#      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
#      EMBEDDING_MODEL_NAME: all-MiniLM-L6-v2
#      EMBEDDING_VECTOR_SIZE: 384

  # API GATEWAY

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    networks:
      - smart-rental-net
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - property-service
      - review-service

  # FRONTEND

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points the React app at the API gateway on the host
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: frontend
    networks:
      - smart-rental-net
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
